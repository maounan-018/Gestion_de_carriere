    metiers: ["Chef de produit", "Chargé de communication", "Responsable marketing digital"]
  - key: achats
    nom: "Achats"
    pole: "Fonctions support & corporate"
    metiers: ["Acheteur", "Gestionnaire fournisseurs", "Category manager"]
  - key: fondation
    nom: "Fondation BMCI"
    pole: "Fonctions support & corporate"
    metiers: ["Chargé de projets RSE / mécénat", "Coordinateur partenariats"]
