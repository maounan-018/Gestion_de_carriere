# =====================================================================
# CARTOGRAPHIE DÉPARTEMENTS → MÉTIERS — BMCI Gestion des Carrières
# =====================================================================
# Référence ÉDITABLE (accès autorisé) pilotant la génération des fiches de poste.
# La "famille (ligne) de métier" et le "périmètre BMCI" du gabarit se déduisent de
# "pole" et "nom". ~165 métiers-types. ⚠️ Fiches générées = SYNTHÉTIQUES.
version: 2

departements:
  # ---------- A. Lignes métiers commerciales ----------
  - key: retail_banking
    nom: "Retail Banking"
    pole: "Lignes métiers commerciales"
    metiers: ["Conseiller clientèle particuliers", "Directeur d'agence",
              "Chargé de clientèle professionnels", "Conseiller MRE",
              "Téléconseiller banque à distance", "Chargé de clientèle patrimoniale agence",
              "Animateur commercial réseau", "Conseiller clientèle digitale"]
  - key: corporate_banking
    nom: "Corporate Banking"
    pole: "Lignes métiers commerciales"
    metiers: ["Chargé d'affaires entreprises", "Analyste crédit corporate",
              "Relationship Manager grandes entreprises", "Chargé Trade Finance",
              "Chargé d'affaires PME", "Cash management officer", "Analyste sectoriel"]
  - key: banque_financiere
    nom: "Banque financière (Financement & Investissement)"
    pole: "Lignes métiers commerciales"
    metiers: ["Structureur financements", "Chargé d'affaires financements structurés",
              "Chargé de financement de projets", "Ingénieur financier", "Analyste crédit CIB"]
  - key: banque_privee
    nom: "Banque Privée"
    pole: "Lignes métiers commerciales"
    metiers: ["Banquier privé", "Gestionnaire de patrimoine", "Ingénieur patrimonial",
              "Conseiller en investissements financiers"]
  - key: bmci_najmah
    nom: "BMCI Najmah (banque participative)"
    pole: "Lignes métiers commerciales"
    metiers: ["Conseiller banque participative", "Spécialiste produits participatifs (Mourabaha/Ijara)",
              "Référent conformité charia", "Chargé de développement banque participative"]
  - key: bu_credit_conso
    nom: "BU Crédit Conso"
    pole: "Lignes métiers commerciales"
    metiers: ["Chargé de crédit à la consommation", "Analyste octroi",
              "Gestionnaire back-office crédit", "Chargé de recouvrement crédit conso"]
  - key: prod_appui_commercial
    nom: "Production & Appui commercial"
    pole: "Lignes métiers commerciales"
    metiers: ["Gestionnaire middle/back-office", "Support réseau commercial",
              "Chargé de production bancaire", "Gestionnaire des opérations clientèle"]

