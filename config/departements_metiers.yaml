              "Analyste conformité opérations internationales"]
  - key: bmci_bourse
    nom: "BMCI Bourse"
    pole: "Marchés, international & filiales"
    metiers: ["Négociateur / Trader actions", "Analyste financier sell-side", "Sales bourse",
              "Gestionnaire back-office titres"]
  - key: alm_treasury
    nom: "ALM Treasury"
    pole: "Marchés, international & filiales"
    metiers: ["Trésorier", "Gestionnaire ALM (actif-passif)", "Opérateur salle des marchés",
              "Middle-office marchés", "Analyste liquidité & refinancement", "Économiste de marché"]
  - key: bmci_leasing
    nom: "BMCI Leasing"
    pole: "Marchés, international & filiales"
    metiers: ["Chargé d'affaires leasing", "Analyste crédit-bail", "Gestionnaire de contrats",
