              "Ingénieur systèmes monétiques", "Chargé acquisition e-commerce", "Chef de projet paiement instantané"]

  # ---------- C. Risques, conformité & contrôle ----------
  - key: risques
    nom: "Risques"
    pole: "Risques, conformité & contrôle"
