# =====================================================================
# Backend — configuration des outils (ruff pour lint + format).
# =====================================================================
# L'app elle-meme reste install-able via requirements.txt (pas de packaging) :
# ce fichier ne declare PAS de [project], il sert uniquement a configurer les
# outils de dev (ruff, pytest). Executez :
#   ruff check .            # lint
#   ruff check --fix .      # lint + auto-fix
#   ruff format .           # format (black-compatible)
# =====================================================================

[tool.ruff]
line-length = 100          # un peu plus large que 88 (black) : code bancaire =
                           # phrases francaises longues dans les docstrings/metier
target-version = "py311"
exclude = [
    "venv", ".venv",
    "__pycache__", ".pytest_cache",
    "alembic/versions",    # migrations auto-generees : on ne reformate pas
]

[tool.ruff.lint]
# Selection raisonnable : erreurs qui comptent, pas chiant.
select = [
    "E",    # pycodestyle (erreurs)
    "F",    # pyflakes (imports morts, variables non utilisees)
    "W",    # pycodestyle (warnings)
    "I",    # isort (ordre des imports)
    "B",    # bugbear (pieges courants : try/except trop larges, mutables defaut)
    "UP",   # pyupgrade (syntaxe moderne : f-strings, type hints natifs)
    "SIM",  # simplify (patterns verbeux)
    "RUF",  # ruff-specific (bonnes pratiques diverses)
]
ignore = [
    "E501",   # line too long : on bornera a 100 cols mais on ne bloque pas sur ca
    "B008",   # Depends(get_db) au niveau param : pattern FastAPI standard
    "UP007",  # Union au lieu de X | Y : certains schemas Pydantic preferent Union
    "SIM108", # if-else -> ternary : parfois moins lisible
    # --- Codebase francaise : les caracteres typographiques (apostrophe droite ',
    # tiret cadratin —, guillemets francais) sont VOULUS dans les docstrings,
    # commentaires et strings metier (messages utilisateur en francais). Les
    # trois regles RUF001/002/003 produisent 20+ faux positifs sur un code bancaire
    # franco-marocain -> on les desactive globalement.
    "RUF001", "RUF002", "RUF003",
    # --- Stylistique mineure, non bloquant pour une revue de code serieuse :
    # ces regles signalent des patterns ameliorables sans incidence sur la
    # correction ou la securite. A reactiver lors d'une passe de polissage dediee.
    "B904",   # raise X from exc : utile en debug mais chainage non critique
    "E402",   # imports pas en tete : parfois volontaire (lazy / post-dotenv)
    "E741",   # variables courtes (l, o, i) dans des list-comps : clarte locale
    "SIM103", # return not (cond) : parfois moins lisible
    "SIM115", # open sans context : parfois justifie (ressources longue duree)
    "SIM117", # with imbriques : parfois volontaire (gestion d'erreur distincte)
    "RUF005", # [a, *b] vs a + list(b) : stylistique
    "RUF012", # ClassVar mutable : vrai piege mais rare ici, cas examines
    "UP028",  # yield from : conversion mecanique sans valeur
    "F841",   # variable locale inutilisee : parfois pour debug ou doc
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]   # imports de fixtures/redefinitions pytest : normal
"__init__.py" = ["F401"]        # re-exports de modules : normal
# Scripts d'ETL / ingestion : imports apres chargement conditionnel de l'env =
# pattern volontaire pour que load_dotenv s'applique avant d'instancier les settings.
"etl_sqlite_to_supabase.py" = ["E402", "E702"]
"ingest_referentiels.py" = ["E402"]
"migrations/**" = ["E402"]      # alembic env.py : imports conditionnels normaux
# Seed de demo : variables courtes dans des list-comprehensions metier (clarte > PEP8).
"app/database/seed.py" = ["E741"]

[tool.pytest.ini_options]
# Chemins (depuis backend/) : les tests sont sous app/tests/.
testpaths = ["app/tests"]
# Hermetique : la fixture conftest neutralise DATABASE_URL -> SQLite jetable.
addopts = "--tb=short -q"
