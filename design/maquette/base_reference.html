<style>
/* Bricolage Grotesque (variable) — display */
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:400 800;font-display:swap;src:url(data:font/woff2;base64,__STRIPPED__) format('woff2');}
/* Hanken Grotesk (variable) — body/UI */
@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:300 800;font-display:swap;src:url(data:font/woff2;base64,__STRIPPED__) format('woff2');}


/* ============ TOKENS · La Courbe (blanc dominant · vert BNP · pas de noir de fond) ============ */
:root{
  --ink:#0E1A14; --ink-2:#41504A; --ink-3:#6E7C75;
  --paper:#FFFFFF; --bg:#F4F8F5; --panel:#F8FBF9; --panel-2:#EDF4EF;
  --border:#E1EAE4; --border-strong:#CBD9D0;
  --green:#00915A; --green-deep:#00784B; --green-soft:#E4F2EA; --green-line:#B9DEC9; --green-ghost:#F0F8F3; --green-wash:#E9F5EE;
  --gold:#B8892E; --gold-soft:#F6EED9;
  --danger:#C23A32; --danger-soft:#FBE9E7;
  --warning:#8A5C12; --warning-soft:#F7EFDB;
  --shadow-sm:0 1px 2px rgba(14,26,20,.04), 0 2px 5px -2px rgba(14,26,20,.05);
  --shadow:0 1px 2px rgba(14,26,20,.04), 0 8px 20px -6px rgba(14,26,20,.10), 0 20px 44px -22px rgba(14,26,20,.14);
  --shadow-lg:0 10px 30px -12px rgba(14,26,20,.14), 0 46px 84px -34px rgba(14,26,20,.26);
  --shadow-float:0 16px 40px -14px rgba(14,26,20,.24), 0 4px 12px -6px rgba(14,26,20,.14);
  --shadow-green:0 10px 22px -8px rgba(0,145,90,.42);
  --r:14px; --r-lg:20px; --r-xl:28px;
  --sans:'Hanken Grotesk',system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --heat-0:#EDF1EE; --heat-1:#D3EBDC; --heat-2:#8CD0A6; --heat-3:#34A469; --heat-4:#0B7A4B;
}

:root[data-theme="light"]{
  --ink:#0E1A14; --ink-2:#41504A; --ink-3:#6E7C75; --paper:#FFFFFF; --bg:#F4F8F5; --panel:#F8FBF9; --panel-2:#EDF4EF;
  --border:#E1EAE4; --border-strong:#CBD9D0; --green:#00915A; --green-deep:#00784B; --green-soft:#E4F2EA; --green-line:#B9DEC9; --green-ghost:#F0F8F3; --green-wash:#E9F5EE;
  --gold:#B8892E; --gold-soft:#F6EED9; --danger:#C23A32; --danger-soft:#FBE9E7; --warning:#8A5C12; --warning-soft:#F7EFDB;
  --shadow-sm:0 1px 2px rgba(14,26,20,.05); --shadow:0 2px 8px -2px rgba(14,26,20,.08), 0 14px 34px -18px rgba(14,26,20,.16);
  --heat-0:#EDF1EE; --heat-1:#D3EBDC; --heat-2:#8CD0A6; --heat-3:#34A469; --heat-4:#0B7A4B;
}


*{box-sizing:border-box}
body{margin:0}
.root{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,p{margin:0}
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}
.disp{font-family:var(--disp);font-weight:700;letter-spacing:-.02em;line-height:1.03;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-3)}
.muted{color:var(--ink-3)}

/* ============ PROTOTYPE SHELL ============ */
.proto{display:grid;grid-template-columns:286px 1fr;min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;background:var(--paper);border-right:1px solid var(--border);
  padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.rail-b{display:flex;align-items:center;gap:10px;padding:2px 4px}
.rail-b .mk{width:34px;height:34px;border-radius:10px;background:var(--green);display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:800;font-size:17px}
.rail-b b{font-size:14px;font-weight:750}.rail-b span{display:block;font-size:10.5px;color:var(--ink-3)}
.rail-note{font-size:11.5px;color:var(--ink-2);background:var(--green-ghost);border:1px solid var(--green-line);padding:11px 13px;border-radius:var(--r);line-height:1.5}
.rail-note b{color:var(--green-deep)}
.rgrp{display:flex;flex-direction:column;gap:3px}
.rgrp h5{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3);font-weight:700;margin:10px 6px 4px}
.ritem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink-2);padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600}
.ritem:hover{background:var(--panel-2);color:var(--ink)}
.ritem.on{background:var(--green-soft);color:var(--green-deep);font-weight:700}
.ritem .n{width:20px;height:20px;border-radius:6px;background:var(--panel-2);color:var(--ink-3);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;font-family:var(--disp)}
.ritem.on .n{background:var(--green);color:#fff}

.stage{display:flex;flex-direction:column;min-width:0}
.sbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(9px);border-bottom:1px solid var(--border)}
.sbar .st-t{font-family:var(--disp);font-weight:700;font-size:15px}
.sbar .st-p{font-size:11.5px;color:var(--ink-3)}
.sbar .sp{flex:1}
.ib{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--paper);color:var(--ink-2);padding:8px 13px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:650}
.ib:hover{border-color:var(--border-strong);color:var(--ink)}
.sscroll{padding:24px 22px 60px;overflow-x:auto}
.vp{max-width:1180px;margin:0 auto}

/* ============ PRIMITIVES ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:12px;border:1px solid transparent;padding:12px 19px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .08s,background .16s,border-color .16s;line-height:1}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.btn-p{background:linear-gradient(180deg,#15a466,var(--green));color:#fff;box-shadow:var(--shadow-green),inset 0 1px 0 rgba(255,255,255,.28)}.btn-p:hover{background:linear-gradient(180deg,#12965c,var(--green-deep))}
.btn-p:disabled{background:var(--panel-2);color:var(--ink-3);cursor:not-allowed;border-color:var(--border)}
.btn-g{background:var(--paper);color:var(--ink);border-color:var(--border-strong)}.btn-g:hover{border-color:var(--ink-3)}
.btn-s{background:var(--green-soft);color:var(--green-deep)}
.btn-ai{background:var(--green-deep);color:#fff}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px}
.block{width:100%}
.link{background:0;border:0;color:var(--green-deep);font-weight:700;cursor:pointer;font-size:13.5px;padding:0}
.link:hover{text-decoration:underline}

.card{background:linear-gradient(180deg,#ffffff,#FBFDFB);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card.p{padding:22px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.sec-h h3{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-.01em}
.divider{height:1px;background:var(--border);margin:2px 0}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
.b-role{background:var(--green);color:#fff}
.b-gold{background:var(--gold-soft);color:var(--gold)}
.b-mut{background:var(--panel-2);color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--panel-2);border:1px solid var(--border);color:var(--ink-2)}
.chip.g{background:var(--green-soft);border-color:var(--green-line);color:var(--green-deep)}
.chip.gap{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.chip.add{border-style:dashed;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
.pill.new{background:var(--green-soft);color:var(--green-deep)} .pill.hot{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warning-soft);color:var(--warning)} .pill.mut{background:var(--panel-2);color:var(--ink-3)} .pill.ai{background:var(--green-wash);color:var(--green-deep)}

.tog{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:12px;font-weight:700;color:var(--ink-3);user-select:none;background:0;border:0}
.tog .tk{width:38px;height:22px;border-radius:999px;background:var(--panel-2);border:1px solid var(--border-strong);position:relative;transition:.18s}
.tog .kn{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:.18s}
.tog[aria-checked="true"] .tk{background:var(--green);border-color:var(--green)}
.tog[aria-checked="true"] .kn{left:18px}
.tog[aria-checked="true"] .on{color:var(--green-deep)}

.svgi{width:18px;height:18px;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.svgi.s{width:15px;height:15px}

/* forms */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--ink-2)}
.inp{display:flex;align-items:center;gap:9px;border:1px solid var(--border-strong);background:var(--paper);border-radius:12px;padding:0 13px;height:46px;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.inp.err{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.inp.ok{border-color:var(--green-line)}
.inp input{border:0;background:transparent;outline:0;flex:1;font-size:14.5px;color:var(--ink);min-width:0}
.inp input::placeholder{color:var(--ink-3)}
.inp .ic{color:var(--ink-3);display:flex}
.meter{height:6px;border-radius:999px;background:var(--panel-2);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;width:0;border-radius:999px;transition:width .25s,background .25s}
.crit{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:12px 0 0;padding:0}
.crit li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);list-style:none}
.crit li .tick{width:16px;height:16px;border-radius:50%;background:var(--panel-2);color:transparent;display:grid;place-items:center;flex:none;transition:.2s}
.crit li.ok{color:var(--ink-2)} .crit li.ok .tick{background:var(--green);color:#fff}
.fhint{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;margin-top:6px}
.fhint.err{color:var(--danger)} .fhint.ok{color:var(--green-deep)}

/* auth */
.auth{min-height:calc(100vh - 150px);display:grid;place-items:center;padding:8px}
.acard{width:100%;max-width:440px;background:var(--paper);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);padding:34px}
.blk{display:flex;align-items:center;gap:11px;justify-content:center;margin-bottom:20px}
.blk .mk{width:40px;height:40px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:800;font-size:19px}
.blk b{font-size:15px;font-weight:750;line-height:1.1}.blk span{font-size:11px;color:var(--ink-3)}
.auth h1{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:-.02em;text-align:center}
.auth .sub{text-align:center;color:var(--ink-3);font-size:13.5px;margin:6px 0 22px}
.stepper{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:24px}
.stepper .st{display:flex;align-items:center;gap:8px}
.stepper .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--panel-2);color:var(--ink-3);border:1px solid var(--border);font-family:var(--disp)}
.stepper .st.done .dot{background:var(--green);color:#fff;border-color:var(--green)}
.stepper .st.active .dot{background:var(--green-soft);color:var(--green-deep);border-color:var(--green-line)}
.stepper .lbl{font-size:11.5px;font-weight:650;color:var(--ink-3)}
.stepper .st.active .lbl,.stepper .st.done .lbl{color:var(--ink-2)}
.stepper .bar{width:22px;height:2px;background:var(--border)} .stepper .st.done + .bar{background:var(--green)}
.otp{display:flex;gap:10px;justify-content:center;margin:6px 0}
.otp input{width:46px;height:56px;text-align:center;font-family:var(--disp);font-size:22px;font-weight:700;border:1px solid var(--border-strong);border-radius:12px;background:var(--paper);color:var(--ink);outline:0}
.otp input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}

/* ============ PORTAIL — hero clair ============ */
.portal{display:grid;grid-template-columns:1.12fr .88fr;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid var(--border);min-height:580px;background:var(--paper)}
.hero{position:relative;padding:38px 40px;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(90% 70% at 8% 6%,var(--green-wash),transparent 55%),linear-gradient(158deg,var(--green-ghost),var(--paper) 72%)}
.hero-b{display:flex;align-items:center;gap:11px;margin-bottom:auto}
.hero-b .mk{width:38px;height:38px;border-radius:11px;background:var(--green);display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:800;font-size:19px}
.hero-b b{font-size:15px;font-weight:750}.hero-b span{font-size:11px;color:var(--ink-3)}
.hero .eyebrow{color:var(--green-deep)}
.hero h1{font-family:var(--disp);font-weight:700;font-size:clamp(30px,4.2vw,44px);letter-spacing:-.025em;line-height:1.03;margin:16px 0 14px;max-width:14ch}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p.lead{color:var(--ink-2);font-size:15px;max-width:40ch;line-height:1.55}
.arc-stage{position:relative;height:196px;margin-top:20px}
.arc-svg{width:100%;height:100%;overflow:visible}
.arc-track{fill:none;stroke:var(--green-line);stroke-width:2}
.arc-path{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round}
.arc-node{fill:var(--paper);stroke:var(--green);stroke-width:2.5}
.arc-node.gold{fill:var(--gold);stroke:var(--gold)}
.arc-lab{fill:var(--ink-2);font-family:var(--sans);font-size:11px;font-weight:700}
.arc-yr{fill:var(--ink-3);font-family:var(--sans);font-size:10px;font-weight:600}
.hero-foot{margin-top:20px;display:flex;gap:18px;color:var(--ink-3);font-size:11.5px}
.hero-foot span{display:inline-flex;align-items:center;gap:6px}
.enter{padding:46px 42px;display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--border)}
.enter .eyebrow{color:var(--green-deep);margin-bottom:12px}
.enter h2{font-family:var(--disp);font-weight:700;font-size:25px;letter-spacing:-.02em;margin-bottom:6px}
.enter p{color:var(--ink-2);font-size:14px;margin-bottom:24px;max-width:38ch}
.cta{display:flex;flex-direction:column;gap:11px;max-width:340px}
.statline{display:flex;margin-top:28px;border-top:1px solid var(--border);padding-top:20px}
.statline div{flex:1}
.statline b{font-family:var(--disp);font-weight:700;font-size:22px;display:block;letter-spacing:-.02em}
.statline small{font-size:11px;color:var(--ink-3)}

/* ============ APP SHELL ============ */
.app{display:grid;grid-template-columns:230px 1fr;background:var(--paper);border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-lg);min-height:680px}
.side{background:var(--panel);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
.side-b{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;margin-bottom:6px;border-bottom:1px solid var(--border)}
.side-b .mk{width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:800;font-size:15px}
.side-b b{font-size:12.5px;font-weight:750;line-height:1.05}.side-b span{font-size:10px;color:var(--ink-3)}
.nav-i{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--ink-2);background:0;border:0;cursor:pointer;font-size:13px;font-weight:600;text-align:left;width:100%;position:relative}
.nav-i:hover{background:var(--panel-2);color:var(--ink)}
.nav-i.on{background:var(--green-soft);color:var(--green-deep);font-weight:700}
.nav-i.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--green)}
.nav-i .svgi{stroke:currentColor}
.side-f{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:8px}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid var(--border);background:var(--paper)}
.top .tt{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-.01em}
.top .ts{font-size:12px;color:var(--ink-3)}
.top .sp{flex:1}
.ib2{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--paper);color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.ib2:hover{border-color:var(--border-strong)}
.ava{border-radius:50%;background:linear-gradient(145deg,#2a8f63,#0c4a31);display:grid;place-items:center;color:#fff;font-weight:700;flex:none;box-shadow:0 6px 16px -6px rgba(12,74,49,.55),inset 0 0 0 1px rgba(255,255,255,.14)}
.ava.xl{width:72px;height:72px;font-size:23px;font-family:var(--disp)}.ava.md{width:34px;height:34px;font-size:12px}.ava.sm{width:28px;height:28px;font-size:11px}
.content{padding:22px;display:grid;gap:16px;background:var(--bg)}
.cols{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;align-items:start}
.main,.content>*,.cols>*,.stack,.parc{min-width:0}
.parc svg{max-width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stack{display:grid;gap:16px;align-content:start}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* profile + ring */
.phead{display:flex;gap:16px;align-items:center}
.pinfo{flex:1;min-width:0}
.pinfo h2{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pinfo .role{color:var(--ink-2);font-size:13.5px;font-weight:600;margin-top:3px}
.pmeta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:11px;font-size:12.5px;color:var(--ink-3)}
.pmeta span{display:inline-flex;align-items:center;gap:6px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rt{fill:none;stroke:var(--panel-2);stroke-width:7}
.ring .rp{fill:none;stroke:var(--green);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .rc{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rc b{font-family:var(--disp);font-weight:700;font-size:16px;line-height:1}
.ring .rc small{font-size:8px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}

/* signature arc parcours */
.parc svg{width:100%;height:auto;display:block;overflow:visible}
.parc .pt{fill:none;stroke:var(--border-strong);stroke-width:2}
.parc .pp{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round}
.parc .nd{fill:var(--paper);stroke:var(--green);stroke-width:2.5}
.parc .nd.now{fill:var(--green)}
.parc .nd.goal{fill:var(--gold);stroke:var(--gold)}
.pstations{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
.pstat .yr{font-size:11px;font-weight:700;color:var(--green-deep)}
.pstat.goal .yr{color:var(--gold)}
.pstat h4{font-size:13px;font-weight:700;margin:2px 0}.pstat p{font-size:11.5px;color:var(--ink-3);line-height:1.4}

/* gauges */
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--border);border-radius:14px;background:var(--panel)}

function sidebar(role,active){
  const items=NAV[role].map(([t,i,l])=>`<button class="nav-i ${l===active?'on':''}" data-go="${t}">${ic(i)}<span>${l}</span></button>`).join('');
  return `<aside class="side"><div class="side-b"><div class="mk">B</div><div><b>BMCI Carrière</b><span>Groupe BNP Paribas</span></div></div>${items}
   <div class="side-f"><button class="btn btn-s btn-sm block" data-go="offres">${ic('bolt','s')} Nouveau projet</button>
   <button class="nav-i" data-go="connexion">${ic('logout')}<span>Déconnexion</span></button></div></aside>`;
}
function top(t,s,role){const b=role==='manager'?'<span class="badge b-role">Manager</span>':role==='rh'?'<span class="badge b-role">RH</span>':'<span class="badge b-mut">Collaborateur</span>';
  return `<div class="top"><div><div class="tt">${t}</div><div class="ts">${s}</div></div><div class="sp"></div>${b}

function stepper(a){return `<div class="stepper">${['Compte','Vérification','Profil'].map((s,i)=>{const c=i<a?'done':i===a?'active':'';return `<div class="st ${c}"><span class="dot">${i<a?'✓':i+1}</span><span class="lbl">${s}</span></div>${i<2?'<span class="bar"></span>':''}`;}).join('')}</div>`;}
